<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Interactive Timeline - Prototype</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0a0a1a 0%, #1a1a3a 50%, #0a0a2a 100%);
            min-height: 100vh;
            overflow: hidden;
            color: white;
        }

        .container {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        .header {
            padding: 20px;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 1.5rem;
            background: linear-gradient(90deg, #ff6b6b, #4ecdc4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .controls {
            display: flex;
            gap: 10px;
        }

        .controls button {
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .controls button:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: scale(1.05);
        }

        .controls button.active {
            background: linear-gradient(90deg, #ff6b6b, #4ecdc4);
            border: none;
        }

        .timeline-3d {
            flex: 1;
            perspective: 1000px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .timeline-container {
            width: 80%;
            height: 60%;
            transform-style: preserve-3d;
            transform: rotateX(20deg) rotateY(0deg);
            transition: transform 0.5s ease;
            position: relative;
        }

        .timeline-axis {
            position: absolute;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, #ff6b6b, #4ecdc4, #45b7d1, #96ceb4, #ffeaa7);
            top: 50%;
            transform: translateY(-50%);
            border-radius: 2px;
            box-shadow: 0 0 20px rgba(255, 107, 107, 0.5);
        }

        .timeline-node {
            position: absolute;
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 50%;
            top: 50%;
            transform: translateY(-50%) translateZ(0);
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
            font-weight: bold;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            border: 2px solid rgba(255, 255, 255, 0.3);
        }

        .timeline-node:hover {
            transform: translateY(-50%) translateZ(50px) scale(1.2);
            box-shadow: 0 20px 40px rgba(102, 126, 234, 0.5);
        }

        .timeline-node.active {
            transform: translateY(-50%) translateZ(80px) scale(1.3);
            background: linear-gradient(135deg, #ff6b6b, #4ecdc4);
            box-shadow: 0 20px 50px rgba(255, 107, 107, 0.7);
        }

        .timeline-node.mcu {
            background: linear-gradient(135deg, #ff6b6b, #ee5a5a);
        }

        .timeline-node.sony {
            background: linear-gradient(135deg, #9b59b6, #8e44ad);
        }

        .timeline-node.fox {
            background: linear-gradient(135deg, #3498db, #2980b9);
        }

        .timeline-node.animation {
            background: linear-gradient(135deg, #1abc9c, #16a085);
        }

        .timeline-label {
            position: absolute;
            bottom: -30px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.6rem;
            white-space: nowrap;
            opacity: 0.7;
            text-align: center;
        }

        .timeline-year {
            position: absolute;
            top: -25px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.8rem;
            font-weight: bold;
            color: #4ecdc4;
        }

        .connection-line {
            position: absolute;
            height: 2px;
            background: rgba(255, 255, 255, 0.2);
            transform-origin: left center;
            pointer-events: none;
        }

        .info-panel {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            padding: 20px;
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            max-width: 400px;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .info-panel.visible {
            opacity: 1;
        }

        .info-panel h3 {
            margin-bottom: 10px;
            color: #4ecdc4;
        }

        .info-panel p {
            font-size: 0.9rem;
            opacity: 0.8;
            line-height: 1.4;
        }

        .universe-label {
            position: absolute;
            top: 10px;
            left: 10px;
            padding: 5px 10px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            font-size: 0.7rem;
        }

        .legend {
            position: absolute;
            top: 80px;
            right: 20px;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 10px;
            font-size: 0.8rem;
        }

        .legend-item {
            display: flex;
            align-items: center;
            margin-bottom: 8px;
        }

        .legend-color {
            width: 15px;
            height: 15px;
            border-radius: 50%;
            margin-right: 10px;
        }

        .instructions {
            position: absolute;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            opacity: 0.5;
            font-size: 0.8rem;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🌌 MCU Multiverse 3D Timeline</h1>
            <div class="controls">
                <button onclick="rotateLeft()">←</button>
                <button onclick="resetView()">Reset</button>
                <button onclick="rotateRight()">→</button>
                <button class="active" onclick="toggleAutoRotate()">Auto</button>
            </div>
        </div>

        <div class="timeline-3d">
            <div class="timeline-container" id="timeline">
                <div class="timeline-axis"></div>
                
                <!-- Nodes will be added by JavaScript -->
            </div>

            <div class="legend">
                <div class="legend-item">
                    <div class="legend-color" style="background: linear-gradient(135deg, #ff6b6b, #ee5a5a);"></div>
                    <span>MCU</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color" style="background: linear-gradient(135deg, #9b59b6, #8e44ad);"></div>
                    <span>Sony</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color" style="background: linear-gradient(135deg, #3498db, #2980b9);"></div>
                    <span>Fox</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color" style="background: linear-gradient(135deg, #1abc9c, #16a085);"></div>
                    <span>Animation</span>
                </div>
            </div>

            <div class="instructions">
                Click nodes for details • Drag to rotate • Scroll to zoom
            </div>

            <div class="info-panel" id="infoPanel">
                <h3 id="infoTitle">Title</h3>
                <p id="infoDescription">Description</p>
            </div>
        </div>
    </div>

    <script>
        const timelineData = [
            { id: 1, title: "Iron Man", year: 2008, universe: "mcu", description: "El inicio del MCU. Tony Stark crea su traje de Iron Man." },
            { id: 2, title: "Spider-Man 2002", year: 2002, universe: "sony", description: "Tobey Maguire como Spider-Man en el universo Sony." },
            { id: 3, title: "X-Men 2000", year: 2000, universe: "fox", description: "El inicio de la era Fox de los X-Men." },
            { id: 4, title: "Avengers", year: 2012, universe: "mcu", description: "Los Vengadores se unen por primera vez." },
            { id: 5, title: "Spider-Verse", year: 2018, universe: "animation", description: "Into the Spider-Verse: Multiverso animado." },
            { id: 6, title: "Endgame", year: 2019, universe: "mcu", description: "El final de la Infinity Saga." },
            { id: 7, title: "No Way Home", year: 2021, universe: "sony", description: "Los tres Spider-Man juntos." },
            { id: 8, title: "Multiverse of Madness", year: 2022, universe: "mcu", description: "Doctor Strange explora el multiverso." },
            { id: 9, title: "Across the Spider-Verse", year: 2023, universe: "animation", description: "Miles viaja por el multiverso." },
            { id: 10, title: "Deadpool 3", year: 2024, universe: "fox", description: "Deadpool se une al MCU." },
        ];

        const timeline = document.getElementById('timeline');
        const infoPanel = document.getElementById('infoPanel');
        const infoTitle = document.getElementById('infoTitle');
        const infoDescription = document.getElementById('infoDescription');

        let rotationY = 0;
        let autoRotate = true;
        let isDragging = false;
        let startX = 0;

        function createTimeline() {
            const minYear = Math.min(...timelineData.map(d => d.year));
            const maxYear = Math.max(...timelineData.map(d => d.year));
            const yearRange = maxYear - minYear;

            timelineData.forEach((item, index) => {
                const node = document.createElement('div');
                node.className = `timeline-node ${item.universe}`;
                
                const position = ((item.year - minYear) / yearRange) * 100;
                node.style.left = `${position}%`;
                node.style.zIndex = index + 1;
                
                // Add slight Z variation for 3D effect
                const zOffset = Math.sin(index * 0.5) * 30;
                node.style.transform = `translateY(-50%) translateZ(${zOffset}px)`;
                
                node.innerHTML = `
                    <span>${item.year}</span>
                    <div class="timeline-label">${item.title}</div>
                    <div class="timeline-year">${item.year}</div>
                `;

                node.addEventListener('click', () => showInfo(item));
                node.addEventListener('mouseenter', () => {
                    node.classList.add('active');
                });
                node.addEventListener('mouseleave', () => {
                    node.classList.remove('active');
                });

                timeline.appendChild(node);
            });
        }

        function showInfo(item) {
            infoTitle.textContent = item.title;
            infoDescription.textContent = item.description;
            infoPanel.classList.add('visible');
        }

        function rotateLeft() {
            rotationY -= 15;
            updateRotation();
        }

        function rotateRight() {
            rotationY += 15;
            updateRotation();
        }

        function resetView() {
            rotationY = 0;
            updateRotation();
        }

        function toggleAutoRotate() {
            autoRotate = !autoRotate;
            document.querySelector('.controls button:last-child').classList.toggle('active');
        }

        function updateRotation() {
            timeline.style.transform = `rotateX(20deg) rotateY(${rotationY}deg)`;
        }

        // Auto-rotation
        function animate() {
            if (autoRotate) {
                rotationY += 0.2;
                updateRotation();
            }
            requestAnimationFrame(animate);
        }

        // Mouse drag rotation
        timeline.addEventListener('mousedown', (e) => {
            isDragging = true;
            startX = e.clientX;
            autoRotate = false;
        });

        document.addEventListener('mousemove', (e) => {
            if (isDragging) {
                const deltaX = e.clientX - startX;
                rotationY += deltaX * 0.5;
                startX = e.clientX;
                updateRotation();
            }
        });

        document.addEventListener('mouseup', () => {
            isDragging = false;
        });

        // Click outside to hide info
        document.addEventListener('click', (e) => {
            if (!e.target.closest('.timeline-node') && !e.target.closest('.info-panel')) {
                infoPanel.classList.remove('visible');
            }
        });

        // Initialize
        createTimeline();
        animate();
    </script>
</body>
</html>
